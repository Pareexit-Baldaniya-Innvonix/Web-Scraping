services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile

    image: amazon-scraper:latest
    container_name: amazon-scraper

    restart: unless-stopped
    init: true

    ports:
      - "8000:8000"

    env_file:
      - .env

    shm_size: "1gb"

    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
      - ./src/amazon_user_session:/app/src/amazon_user_session

    environment:
      PYTHONUNBUFFERED: "1"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"

    stop_grace_period: 30s